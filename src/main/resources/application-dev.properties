# Local development overrides (activate with SPRING_PROFILES_ACTIVE=dev or ./dev.sh)

server.port=8081
app.base-url=http://localhost:8081
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google

# Prefer source static files so ./dev.sh picks up HTML/CSS/JS edits without a rebuild.
# classpath:/static/ remains as fallback for packaged resources.
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Local cwd is fine for ./dev.sh. Prod MUST use mounted /data (see application.properties).
ai.xai.oauth.refresh-token-file=./data/xai-oauth-refresh-token
