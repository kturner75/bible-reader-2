<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory Training — KJV Bible Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="train.css">
</head>
<body>
    <header class="train-header">
        <a class="train-back" id="train-back" href="/read">&#8592; Back to reading</a>
        <a class="train-brand" href="/">KJV</a>
    </header>
    <main class="train-main">
        <div class="train-progress" id="train-progress" hidden>
            <span id="train-progress-current"></span> of <span id="train-progress-total"></span>
        </div>
        <div class="train-card pretraining" id="train-card">
            <div class="train-ref-row">
                <h1 class="train-ref" id="train-ref"></h1>
                <div class="train-toggle-group">
                    <button class="train-peek-toggle" id="train-peek-toggle" hidden
                            aria-expanded="false" aria-controls="passage-preview">Peek</button>
                    <button class="train-test-toggle" id="train-test-toggle">Test mode</button>
                    <button class="train-recite-toggle" id="train-recite-toggle">Recite</button>
                </div>
            </div>
            <div class="train-ref-recall" id="train-ref-recall" hidden>
                <label class="train-ref-label" for="train-ref-input">What&rsquo;s the reference?</label>
                <input id="train-ref-input" class="train-ref-input" type="text"
                       autocomplete="off" spellcheck="false" placeholder="John 3:16"
                       aria-describedby="train-ref-feedback">
                <p class="train-ref-feedback" id="train-ref-feedback" hidden></p>
            </div>
            <section class="passage-preview" id="passage-preview" aria-label="Passage preview">
                <p class="passage-preview-intro">Read through the passage before you begin.</p>
                <div class="passage-preview-text" id="passage-preview-text"></div>
                <button class="train-btn-begin" id="train-begin-btn">Begin training</button>
            </section>
            <div class="train-verse" id="train-verse"></div>
            <div id="recite-panel" hidden>
                <p class="recite-instruction">Speak the verse from memory</p>
                <div class="recite-controls">
                    <button id="record-btn" class="record-btn" aria-label="Start recording">
                        <span class="record-icon"></span>
                        <span class="record-label">Tap to record</span>
                    </button>
                    <span id="recording-status" class="recording-status" hidden>
                        <span class="recording-dot"></span> Recording&hellip;
                    </span>
                </div>
            </div>
            <div id="transcript-panel" hidden>
                <p class="transcript-label">Heard</p>
                <p id="transcript-heard" class="transcript-heard"></p>
                <p class="transcript-label" style="margin-top:.75rem">Verse comparison</p>
                <div id="transcript-diff" class="transcript-diff"></div>
                <p id="accuracy-display" class="accuracy-display"></p>
            </div>
            <div class="train-actions">
                <button class="train-btn-check" id="train-check-btn">Check</button>
            </div>
            <div class="train-ratings" id="train-ratings" hidden>
                <p class="train-ratings-label">How well did you know it?</p>
                <div class="train-rating-btns">
                    <button class="rating-btn rating-again" data-quality="0">Again</button>
                    <button class="rating-btn rating-hard"  data-quality="3">Hard</button>
                    <button class="rating-btn rating-good"  data-quality="4">Good</button>
                    <button class="rating-btn rating-easy"  data-quality="5">Easy</button>
                </div>
            </div>
            <p class="train-error" id="train-error" hidden></p>
        </div>
        <div class="train-done" id="train-done" hidden>
            <p class="train-done-icon">&#10003;</p>
            <h2 class="train-done-title" id="train-done-title">All done for today!</h2>
            <p class="train-done-sub" id="train-done-sub">Your reviews are saved. Come back tomorrow for the next session.</p>
            <div class="train-done-actions">
                <button type="button" class="train-done-link" id="train-next-up" hidden>Next Up</button>
                <a class="train-done-link" id="train-done-dashboard" href="/dashboard">Back to dashboard</a>
                <a class="train-done-link train-done-link-secondary" id="train-done-reading" href="/read">Back to reading</a>
            </div>
        </div>
    </main>
    <script src="date-utils.js"></script>
    <script src="csrf-utils.js"></script>
    <script src="train.js"></script>
</body>
</html>
