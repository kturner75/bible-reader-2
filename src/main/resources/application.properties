# KJV Bible Reader Configuration
server.port=8080

# Trust reverse proxy headers (Nginx SSL termination → HTTPS redirects)
server.forward-headers-strategy=native

# Session cookie — explicit SameSite (H3). Secure is inferred from the request
# when behind TLS-terminating Nginx with forwarded headers.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true


# Serve static resources
spring.web.resources.static-locations=classpath:/static/

# JSON configuration
spring.jackson.serialization.indent-output=false

# Whisper STT — raise multipart limits to match Whisper's 25 MB max audio size
spring.servlet.multipart.max-file-size=26MB
spring.servlet.multipart.max-request-size=26MB

# TTS Configuration
# tts.provider: openai (default) | xai — selects endpoint, API key, and default voice
# openai: https://api.openai.com/v1/audio/speech, tts.api-key (${OPENAI_API_KEY}), voice onyx, model tts-1-hd
# xai:    https://api.x.ai/v1/tts, XAI_API_KEY, voice eve (no model field)
# TTS_VOICE / tts.voice is passed through as the xAI voice_id (case-insensitive).
# Unset defaults to onyx (openai) or eve (xai). Any string is accepted — no closed enum.
# Built-in xAI voices (eve, ara, rex, and the rest) are listed by
# GET https://api.x.ai/v1/tts/voices — do not bake the roster into code.
# Unknown ids 404 that generate and are not written to Spaces.
# Unknown TTS_PROVIDER fails closed — no spend
tts.enabled=true
tts.provider=${TTS_PROVIDER:openai}
tts.api-key=${OPENAI_API_KEY:}
tts.voice=${TTS_VOICE:}
tts.model=tts-1-hd
tts.prefetch-count=10

# STT Configuration (scripture memorization recitation)
# stt.provider: openai (default) | xai — selects endpoint, model, and API key automatically
# openai uses OPENAI_API_KEY; xai uses XAI_API_KEY
stt.provider=${STT_PROVIDER:openai}

# Verse of the Day (AI-generated via Chat Completions, daily at midnight UTC)
# votd.provider: openai (default) | xai — selects endpoint, API key, and default model
# openai: https://api.openai.com/v1/chat/completions, tts.api-key (${OPENAI_API_KEY}), gpt-4o-mini
# xai:    https://api.x.ai/v1/chat/completions, XAI_API_KEY, grok-3-mini
# VOTD_MODEL overrides the provider default when set
votd.enabled=${VOTD_ENABLED:true}
votd.provider=${VOTD_PROVIDER:openai}
votd.model=${VOTD_MODEL:}

# Digital Ocean Spaces Configuration
spaces.enabled=true
spaces.endpoint=https://nyc3.digitaloceanspaces.com
spaces.bucket=readthekjv
spaces.cdn-url=https://readthekjv.nyc3.cdn.digitaloceanspaces.com
spaces.access-key=${DO_SPACES_ACCESS_KEY:}
spaces.secret-key=${DO_SPACES_SECRET_KEY:}
spaces.audio-prefix=audio

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${KJV_DB_HOST:localhost}:${KJV_DB_PORT:5432}/${KJV_DB_NAME:readthekjv}?sslmode=${KJV_DB_SSLMODE:disable}
spring.datasource.username=${KJV_DB_USERNAME:kevinturner}
spring.datasource.password=${KJV_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=BibleReaderPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# X (Twitter) daily verse posting — noon UTC (7 AM Eastern)
x.enabled=${X_ENABLED:true}
x.api-key=${X_API_KEY:}
x.api-secret=${X_API_SECRET:}
x.access-token=${X_ACCESS_TOKEN:}
x.access-token-secret=${X_ACCESS_TOKEN_SECRET:}
# Base URL for deep links in tweets (reuses APP_BASE_URL env var)
app.base-url=${APP_BASE_URL:https://readthekjv.com}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-placeholder}
spring.security.oauth2.client.registration.google.scope=email,profile
# Explicit redirect URI so Spring doesn't construct it with http:// behind Nginx SSL termination
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/google

# Remember-me — keeps users signed in for 30 days (persistent_logins table, see V12 migration).
# Key is used to validate the remember-me cookie signature; set REMEMBER_ME_KEY in production.
security.remember-me.key=${REMEMBER_ME_KEY:dev-remember-me-key-change-in-prod}
